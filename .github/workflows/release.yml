name: Release

# A version tag (`v0.1.0`) publishes a GitHub Release with prebuilt binaries.
# Ordinary pushes never reach the publish job because this workflow only runs on
# version tags.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on the same checks CI runs, and refuse a tag whose version
  # does not match Cargo.toml.
  verify:
    name: Verify the tag and run the gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve the version and check the tag
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version '$version' is not X.Y.Z"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Koda $version"
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets -- --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Record the runner platform
        run: uname -s && uname -m
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the release binary
        # The linker preference is target-specific, so it is inert for the other
        # targets. musl-tools provides `musl-gcc`.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify the binary architecture
        run: scripts/check-binary.sh "${{ matrix.name }}" "target/${{ matrix.target }}/release/koda"
      - name: Package the artifact
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/koda" "$staging/koda"
          cp LICENSE "$staging/LICENSE"
          archive="koda-$VERSION-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C "$staging" koda LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: koda-${{ matrix.name }}
          path: |
            koda-*.tar.gz
            koda-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Verify every artifact
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/verify-release.sh "$VERSION" dist
      - name: Write the combined checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum koda-"$VERSION"-*.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(
            dist/koda-"$VERSION"-*.tar.gz
            dist/koda-"$VERSION"-*.tar.gz.sha256
            dist/SHA256SUMS
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title "Koda $VERSION" \
              --generate-notes \
              "${assets[@]}"
          fi
