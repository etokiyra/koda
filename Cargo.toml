[package]
# The crate is `koda-ide` because `koda` is already taken on crates.io; the
# installed binary is still `koda`.
name = "koda-ide"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A modern, lightweight, terminal-native IDE"
license = "MPL-2.0"
repository = "https://github.com/etokiyra/koda"
homepage = "https://github.com/etokiyra/koda"
documentation = "https://docs.rs/koda-ide"
readme = "README.md"
keywords = ["ide", "tui", "editor", "lsp", "terminal"]
categories = ["command-line-utilities", "development-tools", "text-editors"]
default-run = "koda"

[lib]
name = "koda"
path = "src/lib.rs"

[[bin]]
name = "koda"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
ropey = "1.6.1"
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
